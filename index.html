<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺中市西屯區長安國小 定期評量即時管理系統｜和風考務指揮與三端同步平台</title>
  <meta name="description" content="臺中市西屯區長安國小專用：教室監考端、電子黑板端與教務行政端三端即時同步的國小定期成績評量考務管理系統。提供各班應到/實到/缺席即時填報、班級與導師一對一配對、考場突發狀況回報與雙向受理、試題更正即時公告廣播與電子黑板大螢幕高對比顯示。日式和風雅緻視覺，支援 Google Firebase 雲端即時資料庫。">
  
  <!-- 字型連結：Noto Serif TC (源流明朝風)、Noto Sans TC、JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
  
  <!-- 和風美學樣式表 -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase v10 Compat SDK (CDN 即用，無需本機建置編譯) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- 核心應用程式掛載容器 -->
  <div id="app"></div>

  <!-- 彈出視窗容器 -->
  <div id="modal-container"></div>

  <!-- 應用程式腳本載入 -->
  <script src="js/mock-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
